# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the APKs on ALS and, for a v* tag, publishes the release the app updates itself from (docs/updates.md).
name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a release with this tag (e.g. v0.4); empty: only build"
        required: false
        default: ""

env:
  SDK_TOOLS: commandlinetools-linux-11076708_latest.zip
  ANDROID_HOME: /opt/android-sdk

jobs:
  build:
    runs-on: als-huge
    container:
      image: altlinux.space/actions/runner/containers:sisyphus
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq java-17-openjdk-devel unzip curl git jq
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/sdk.zip "https://dl.google.com/android/repository/$SDK_TOOLS"
          unzip -q /tmp/sdk.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - uses: actions/checkout@v4

      - name: Release keystore (only when the secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.LUCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            echo "LUCH_KEYSTORE=/tmp/release.jks" >> "$GITHUB_ENV"
          fi

      # A fork's APK looks for updates in the fork's own releases; the author's repository uses the defaults of build.gradle.
      - name: Build
        working-directory: android
        env:
          LUCH_KEYSTORE_PASSWORD: ${{ secrets.LUCH_KEYSTORE_PASSWORD }}
          LUCH_KEY_ALIAS: ${{ secrets.LUCH_KEY_ALIAS }}
          LUCH_KEY_PASSWORD: ${{ secrets.LUCH_KEY_PASSWORD }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="${TAG_INPUT:-}"
          case "$GITHUB_REF" in refs/tags/v*) TAG="${GITHUB_REF#refs/tags/}" ;; esac
          args=""
          if [ "$GITHUB_REPOSITORY" != "Luch/luch-android" ]; then
            args="-PluchUpdateFeeds=${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/latest"
          fi
          # A tag decides the version the app reports; without one the numbers of build.gradle stay.
          if [ -n "$TAG" ]; then
            args="$args -PluchVersionName=${TAG#v} -PluchVersionCode=${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ./gradlew --no-daemon $args assembleGithubDebug assembleGithubRelease assembleFdroidRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/github/debug/app-github-debug.apk ../dist/luch-debug.apk
          for f in app/build/outputs/apk/github/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" ../dist/luch-release-unsigned.apk ;;
              *) cp "$f" ../dist/luch-release.apk ;;
            esac
          done
          # Forgejo has no per-asset digest: the app reads it from this file.
          [ -f ../dist/luch-release.apk ] && (cd ../dist && sha256sum luch-release.apk > luch-release.apk.sha256)
          ls -la ../dist

      - name: Release
        if: env.TAG != ''
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          code=$(curl -s -o rel.json -w '%{http_code}' -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" "$API/releases")
          [ "$code" = 201 ] || { echo "release: HTTP $code"; cat rel.json; exit 1; }
          id=$(jq -r .id rel.json)
          for f in dist/*; do
            curl -fsS -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$API/releases/$id/assets?name=$(basename "$f")" >/dev/null
          done
          echo "release $TAG published"
