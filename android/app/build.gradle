plugins {
    id 'com.android.application'
}

// Release signing, in this order:
//  1. a keystore given in the environment (CI secrets): LUCH_KEYSTORE (path), LUCH_KEYSTORE_PASSWORD, LUCH_KEY_ALIAS,
//     LUCH_KEY_PASSWORD;
//  2. the debug key, with -PluchDebugSign (installing over adb during development);
//  3. otherwise unsigned, as F-Droid builds it (F-Droid signs with its own key).
def keystore = System.getenv('LUCH_KEYSTORE')
def debugSign = project.hasProperty('luchDebugSign')

android {
    namespace 'ru.toxblh.luch'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.toxblh.luch'
        minSdk 21
        targetSdk 34
        // -PluchVersionCode / -PluchVersionName: only for trying an update on an emulator (docs/updates.md).
        versionCode Integer.parseInt(String.valueOf(project.findProperty('luchVersionCode') ?: '3'))
        versionName String.valueOf(project.findProperty('luchVersionName') ?: '0.3')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    // Where the APK is published decides whether it may update itself:
    //  - github: the release APK on GitHub, updates itself from GitHub releases (docs/updates.md);
    //  - fdroid, play: the store updates the app; a self-updater there is against both stores' rules.
    flavorDimensions 'store'
    productFlavors {
        github {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'
        }
        fdroid {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
        }
        play {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
        }
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('LUCH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LUCH_KEY_ALIAS')
                keyPassword System.getenv('LUCH_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystore) {
                signingConfig signingConfigs.release
            } else if (debugSign) {
                signingConfig signingConfigs.debug
            }
        }
    }

    // F-Droid reproducible builds: no build-time stamps or dependency metadata blobs in the APK.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Only for the on-device tests (./gradlew connectedAndroidTest on an emulator); nothing of it goes into the APK.
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
