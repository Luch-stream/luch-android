plugins {
    id 'com.android.application'
}

// Release signing, in this order:
//  1. a keystore given in the environment (CI secrets): LUCH_KEYSTORE (path), LUCH_KEYSTORE_PASSWORD, LUCH_KEY_ALIAS,
//     LUCH_KEY_PASSWORD;
//  2. the debug key, with -PluchDebugSign (installing over adb during development);
//  3. otherwise unsigned, as F-Droid builds it (F-Droid signs with its own key).
def keystore = System.getenv('LUCH_KEYSTORE')
def debugSign = project.hasProperty('luchDebugSign')

android {
    namespace 'ru.toxblh.luch'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.toxblh.luch'
        minSdk 21
        targetSdk 34
        // -PluchVersionCode / -PluchVersionName: only for trying an update on an emulator (docs/updates.md).
        versionCode Integer.parseInt(String.valueOf(project.findProperty('luchVersionCode') ?: '4'))
        versionName String.valueOf(project.findProperty('luchVersionName') ?: '0.4')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    // Where the self-updater looks for a newer release, in order ("|"): ALS first, GitHub as the fallback.
    // -PluchUpdateFeeds=... points a build at a fork's releases (a test of the whole chain).
    defaultConfig {
        buildConfigField 'String', 'UPDATE_FEEDS', '"' + String.valueOf(project.findProperty('luchUpdateFeeds') ?:
                'https://altlinux.space/api/v1/repos/Luch/luch-android/releases/latest|' +
                'https://api.github.com/repos/Luch-stream/luch-android/releases/latest') + '"'
    }

    // Where the APK is published decides whether it may update itself:
    //  - github: the release APK on GitHub, updates itself from GitHub releases (docs/updates.md);
    //  - fdroid, play: the store updates the app; a self-updater there is against both stores' rules.
    flavorDimensions 'store'
    productFlavors {
        github {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'true'
        }
        fdroid {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
        }
        play {
            dimension 'store'
            buildConfigField 'boolean', 'SELF_UPDATE', 'false'
        }
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('LUCH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LUCH_KEY_ALIAS')
                keyPassword System.getenv('LUCH_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        // -PluchDev: a debug build beside an installed release (ru.toxblh.luch.dev), for a device whose release
        // was signed with another key; it takes the next free control port and announces itself as usual.
        debug {
            if (project.hasProperty('luchDev')) {
                applicationIdSuffix '.dev'
                versionNameSuffix '-dev'
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystore) {
                signingConfig signingConfigs.release
            } else if (debugSign) {
                signingConfig signingConfigs.debug
            }
        }
    }

    // F-Droid reproducible builds: no build-time stamps or dependency metadata blobs in the APK.
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Only for the on-device tests (./gradlew connectedAndroidTest on an emulator); nothing of it goes into the APK.
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    // JVM tests of the logic that needs no device (./gradlew testFdroidDebugUnitTest); org.json is the real one,
    // as Android's is only a stub there.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
