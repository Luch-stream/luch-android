# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # for the release on a v* tag

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Release keystore (only when the secret is set)
        env:
          KEYSTORE_BASE64: ${{ secrets.LUCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LUCH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      # github: the APK published here, which updates itself from these releases (docs/updates.md);
      # fdroid: built the way F-Droid builds it (no self-update), to catch breakage early.
      - name: Build debug and release APKs
        env:
          LUCH_KEYSTORE_PASSWORD: ${{ secrets.LUCH_KEYSTORE_PASSWORD }}
          LUCH_KEY_ALIAS: ${{ secrets.LUCH_KEY_ALIAS }}
          LUCH_KEY_PASSWORD: ${{ secrets.LUCH_KEY_PASSWORD }}
          REPORT_DSN: ${{ secrets.REPORT_DSN }}
        # "Send to the developers" only in the github builds; the F-Droid build sends nothing, as F-Droid's own does.
        run: |
          ./gradlew --no-daemon assembleFdroidRelease
          ./gradlew --no-daemon -PluchReportDsn="$REPORT_DSN" assembleGithubDebug assembleGithubRelease

      - name: Name the APKs
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/github/debug/app-github-debug.apk ../dist/luch-debug.apk
          # The self-updater looks for luch-release.apk: only a build signed with the release key may carry that name.
          for f in app/build/outputs/apk/github/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" ../dist/luch-release-unsigned.apk ;;
              *) cp "$f" ../dist/luch-release.apk ;;
            esac
          done
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: luch-apk
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
